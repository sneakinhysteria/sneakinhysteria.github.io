media:
  - name: images
    label: Images
    input: src/content/images
    output: /content/images

content:
  - name: posts
    label: Posts
    type: collection
    path: src/posts
    format: yaml-frontmatter
    subfolders: false
    filename: "{fields.slug}.md"
    exclude:
      - posts.11tydata.js
    view:
      primary: title
      sort: [date, title]
      order: desc
      fields: [title, date, draft]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
        description: Becomes the URL and the filename. Lowercase, hyphens, no spaces.
      - name: date
        label: Published
        type: date
        required: true
      - name: excerpt
        label: Excerpt
        type: text
        description: One line. Used in listings, the meta description and RSS.
      - name: image
        label: Feature image
        type: image
        media: images
        categories: [image]
        path: uploads
        rename: safe
      - name: tags
        label: Tags
        type: select
        required: true
        default: [posts]
        options:
          multiple: true
          values:
            - posts
            - thoughts
            - players
            - music
            - business
            - queer
            - society
            - design
            - photos
            - lego
            - riding
            - galgo
            - ev-conversion
            - news
        description: Keep "posts" selected — it is what the homepage and feed collect on.
      - name: draft
        label: Draft
        type: boolean
        default: false
        description: Drafts are left out of the built site entirely.
      - name: body
        label: Body
        type: rich-text
        media: images

  - name: pages
    label: Pages
    type: collection
    path: src/pages
    format: yaml-frontmatter
    subfolders: false
    filename: "{fields.slug}.md"
    exclude:
      - pages.11tydata.js
    view:
      primary: title
      fields: [title, draft]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
      - name: date
        label: Published
        type: date
      - name: excerpt
        label: Excerpt
        type: text
      - name: image
        label: Feature image
        type: image
        media: images
        categories: [image]
        path: uploads
        rename: safe
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: body
        label: Body
        type: rich-text
        media: images
